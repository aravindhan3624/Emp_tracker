<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldForce 360 · Live Demo</title>
<style>
  body { margin: 0; background: #e9edf4; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #142033; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #0b1f44; color: #fff; flex-wrap: wrap; }
  .bar b { font-size: 15px; } .bar span { opacity: .75; font-size: 13px; }
  .stage { display: flex; gap: 18px; padding: 16px; align-items: flex-start; }
  .phone { flex: none; width: 380px; height: clamp(560px, calc(100vh - 90px), 790px); border-radius: 44px; background: #111; padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); position: sticky; top: 16px; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: #fff; }
  .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #5d6b82; margin: 0 0 8px 6px; }
  .desk { flex: 1; min-width: 0; }
  .desk iframe { width: 100%; height: 1150px; border: 1px solid #d5dbe5; border-radius: 12px; background: #fff; }
  @media (max-width: 1000px) { .stage { flex-direction: column; align-items: center; } .phone { position: static; } .desk { width: 100%; } }
</style>
</head>
<body>
  <div class="bar"><b>FieldForce 360 — live demo</b><span>Left: employee Android app · Right: manager web dashboard · both share the same data in real time</span></div>
  <div class="stage">
    <div><div class="label">Employee app (APK)</div><div class="phone"><iframe src="index.html" title="Employee app"></iframe></div></div>
    <div class="desk"><div class="label">Manager dashboard (web)</div><iframe src="admin.html" title="Manager dashboard"></iframe></div>
  </div>
</body>
</html>
