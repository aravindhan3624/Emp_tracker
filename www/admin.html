<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldForce 360 · Manager Dashboard</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --brand: #0b3b8c; --bg: #f2f4f8; --card: #fff; --ink: #142033; --muted: #5d6b82; --line: #e2e7ef; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--brand); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header .mark { width: 34px; height: 34px; border-radius: 9px; background: #fff; color: var(--brand); font-weight: 800; display: grid; place-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header small { opacity: .8; }
  header .sp { flex: 1; }
  header select, header button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 0; }
  header button { background: rgba(255,255,255,.16); color: #fff; cursor: pointer; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: rgba(255,255,255,.14); padding: 5px 10px; border-radius: 99px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: p 1.6s infinite; }
  @keyframes p { 50% { opacity: .3; } }
  .wrap { padding: 16px 20px 30px; max-width: 1500px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi span { color: var(--muted); font-size: 12.5px; }
  .kpi b { display: block; font-size: 22px; margin-top: 2px; }
  .kpi small { color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  .card h2 { font-size: 14.5px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #map { height: 440px; border-radius: 10px; border: 1px solid var(--line); }
  .alerts { max-height: 440px; overflow: auto; }
  .alert { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .alert:last-child { border: 0; }
  .alert .lv { width: 8px; border-radius: 4px; flex: none; }
  .lv.bad { background: #ef4444; } .lv.warn { background: #f59e0b; } .lv.info { background: #3b82f6; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px 0 10px; flex-wrap: wrap; }
  .tabs button { background: none; border: 0; padding: 9px 12px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--brand); border-color: var(--brand); font-weight: 600; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr.sel td { background: #eef4ff; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: #f7f9fc; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: #eef2f8; color: #334155; font-weight: 500; }
  .tag.ok { background: #e7f6ec; color: var(--ok); } .tag.warn { background: #fdf3e2; color: var(--warn); } .tag.bad { background: #fde8e8; color: var(--bad); } .tag.info { background: #e6efff; color: #1d4ed8; }
  .av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; margin-right: 8px; vertical-align: middle; }
  .mini { height: 6px; width: 80px; background: #e7ebf2; border-radius: 9px; display: inline-block; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: #22c55e; }
  .emk { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
  .emk.stale { filter: grayscale(1); opacity: .75; }
  .vpin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .bpin { background: #0b3b8c; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 6px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .btn { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="mark">FF</div>
  <div><h1>FieldForce 360 · Manager Dashboard</h1><small id="org"></small></div>
  <div class="sp"></div>
  <span class="live"><i></i> Live · <span id="clock"></span></span>
  <select id="branchSel"><option value="">All branches</option></select>
  <button id="resetBtn" title="Clear today's demo data">Reset demo</button>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card">
      <h2>Live employee map <span style="font-weight:400;color:var(--muted);font-size:12.5px" id="mapHint">Click an employee to focus their route</span></h2>
      <div id="map"></div>
      <div class="legend"><span style="--c:#64748b">Pending visit</span><span style="--c:#2563eb">In progress</span><span style="--c:#16a34a">Completed · GPS verified</span><span style="--c:#d97706">Completed · flagged</span></div>
    </div>
    <div class="card">
      <h2>Alerts <span class="tag" id="alertCount">0</span></h2>
      <div class="alerts" id="alerts"></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="tabs" id="tabs">
      <button data-t="emp" class="active">Employees</button><button data-t="att">Attendance</button><button data-t="vis">Customer visits</button><button data-t="col">Collections</button><button data-t="aud">Audit log</button>
      <span style="flex:1"></span><button class="btn" id="exportBtn" style="margin:4px 0">⬇ Export CSV (Excel)</button>
    </div>
    <div class="tbl" id="table"></div>
  </div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
